[package]
name = "poe2-stash-tracker"
version = "0.1.0"
description = "Tracker de coffres et de net worth pour Path of Exile 2"
authors = ["ShigenoTV"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows.
name = "poe2_stash_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
