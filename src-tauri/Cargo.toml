[package]
name = "poe2-stash-tracker"
version = "0.0.4"
description = "Tracker de coffres et de net worth pour Path of Exile 2"
authors = ["ShigenoTV"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows.
name = "poe2_stash_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
sha2 = "0.10"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "sync"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_Xps",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
